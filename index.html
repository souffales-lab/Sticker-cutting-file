<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Sheet & Cutline Studio ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Library ZIP & Save -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFFDF0;
            --card-bg: #FFFFFF;
            --accent-yellow: #FDE8AF;
            --brown-text: #785A46;
            --brown-dark: #5C4333;
            --brown-btn: #A0785C;
            --brown-btn-hover: #8A644A;
            --border-dashed: #E2CFB4;
            --border-solid: #EFE4D3;
            --danger: #E57373;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-cream);
            color: var(--brown-text);
            line-height: 1.5;
            padding: 24px 16px;
        }

        .header-title { text-align: center; margin-bottom: 24px; }
        .header-title h1 { 
            font-family: 'Fredoka', cursive;
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--brown-dark); 
        }
        .header-title p { color: var(--brown-text); font-size: 0.95rem; margin-top: 4px; font-weight: 600; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-solid);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(120, 90, 70, 0.05);
        }

        .card-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brown-dark);
        }

        .section-subtitle {
            font-family: 'Fredoka', cursive;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--border-dashed);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--brown-dark);
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        label {
            display: block;
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--brown-text);
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-solid);
            background-color: var(--card-cream);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: var(--brown-dark);
            font-weight: 700;
            outline: none;
        }

        .custom-dimensions {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: var(--card-cream);
            border: 1.5px dashed var(--border-dashed);
            border-radius: var(--radius-md);
        }

        .btn-upload-box {
            border: 2px dashed var(--border-dashed);
            color: var(--brown-dark);
            background-color: var(--card-cream);
            padding: 18px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            display: block;
            transition: all 0.2s ease;
        }

        .btn-upload-box:hover { background-color: var(--accent-yellow); }

        .sticker-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
        }

        .sticker-item {
            position: relative;
            background: var(--card-cream);
            border: 1.5px solid var(--border-solid);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sticker-thumb {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-solid);
        }

        .sticker-details { flex-grow: 1; }
        .sticker-filename { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: var(--brown-dark); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sticker-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .sticker-inputs label { font-size: 0.7rem; margin-bottom: 2px; }
        .sticker-inputs input { padding: 6px 8px; font-size: 0.85rem; border-radius: var(--radius-sm); }

        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: var(--brown-dark);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete:hover { background: var(--danger); color: #FFF; }

        .btn {
            background: var(--brown-btn);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 0 var(--brown-dark);
        }

        .btn:hover { background: var(--brown-btn-hover); }

        .download-bar { display: none; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .download-row { display: flex; gap: 10px; }
        .download-bar .btn { margin-top: 0; flex: 1; font-size: 0.88rem; padding: 12px 8px; }
        .btn-success { background: #7CA982; box-shadow: 0 4px 0 #5B8361; }
        .btn-danger { background: #D98880; box-shadow: 0 4px 0 #B5655D; }
        .btn-zip { background: #E5A93C; box-shadow: 0 4px 0 #B37E20; }

        .pagination-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--card-cream);
            padding: 10px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-solid);
            margin-bottom: 16px;
        }

        .page-btn {
            background: var(--brown-btn);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-family: 'Fredoka', cursive;
            cursor: pointer;
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .preview-grid { grid-template-columns: 1fr; } }

        .preview-box { background: var(--card-cream); border: 2px solid var(--border-solid); border-radius: var(--radius-lg); padding: 14px; text-align: center; }
        .preview-box h4 { font-family: 'Fredoka', cursive; font-size: 0.9rem; color: var(--brown-text); margin-bottom: 8px; }
        canvas { max-width: 100%; height: auto; border: 2px solid var(--border-solid); border-radius: var(--radius-md); background: #FFF; }
        .empty-state { color: var(--brown-text); font-size: 0.85rem; text-align: center; padding: 20px 0; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-title">
    <h1>✂️ Sticker Layout Studio ✨</h1>
    <p>Susun stiker otomatis ke banyak lembar & ekspor vector SVG cutting line</p>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">⚙️ Pengaturan Lembar</div>
        
        <div class="form-group">
            <label>Ukuran Kertas / Area Cetak</label>
            <select id="sheetSize" onchange="toggleCustomSize()">
                <option value="A4">A4 Standard (210 x 297 mm)</option>
                <option value="A4_Vendor">A4 Area Cetak Vendor (190 x 277 mm)</option>
                <option value="A3" selected>A3 Standard (297 x 420 mm)</option>
                <option value="A3Plus">A3+ Standard (329 x 483 mm)</option>
                <option value="A3Plus_Vendor">A3+ Area Cetak Vendor (300 x 450 mm)</option>
                <option value="custom">✨ Custom Size (Input Sendiri)</option>
            </select>
        </div>

        <div id="customDimensions" class="custom-dimensions form-row">
            <div class="form-group" style="margin-bottom:0;">
                <label>Lebar Area (mm)</label>
                <input type="number" id="customWidth" value="200">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Tinggi Area (mm)</label>
                <input type="number" id="customHeight" value="300">
            </div>
        </div>

        <div class="form-row" style="margin-top: 12px;">
            <div class="form-group">
                <label>Margin (mm)</label>
                <input type="number" id="sheetMargin" value="10">
            </div>
            <div class="form-group">
                <label>Jarak Stiker (mm)</label>
                <input type="number" id="stickerGap" value="3">
            </div>
        </div>

        <div class="section-subtitle">
            <span>🖼️ Upload Stiker</span>
        </div>

        <div class="form-group">
            <label class="btn-upload-box" for="fileInput">
                📁 Klik Di Sini Untuk Pilih Gambar (PNG)
            </label>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        </div>

        <div class="section-subtitle">
            <span>📋 Daftar Desain</span>
            <span id="itemCount" style="font-size:0.75rem; color:var(--brown-text);">0 item</span>
        </div>

        <div id="stickerList" class="sticker-list">
            <div class="empty-state">Belum ada gambar yang di-upload.</div>
        </div>

        <button class="btn" onclick="generateLayout()">✨ Generate Multi-Page Layout</button>
    </div>

    <div class="card">
        <div class="card-title">👁️ Preview & Download</div>

        <!-- Pagination -->
        <div id="pagination" class="pagination-container">
            <button id="prevPageBtn" class="page-btn" onclick="changePage(-1)">◀ Lembar Sebelum</button>
            <span id="pageIndicator" style="font-family:'Fredoka'; font-weight:600;">Lembar 1 dari 1</span>
            <button id="nextPageBtn" class="page-btn" onclick="changePage(1)">Lembar Berikut ▶</button>
        </div>

        <div id="actionButtons" class="download-bar">
            <div class="download-row">
                <button class="btn btn-success" onclick="downloadCetakCurrent()">📥 Lembar Ini (PNG)</button>
                <button class="btn btn-danger" onclick="downloadCuttingCurrent()">✂️ Cutting Lembar Ini (SVG)</button>
            </div>
            <button class="btn btn-zip" onclick="downloadAllZip()">📦 Download Semua Lembar (ZIP)</button>
        </div>

        <div class="preview-grid">
            <div class="preview-box">
                <h4>Preview Hasil Cetak</h4>
                <canvas id="printCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h4>Preview Line Cutting (Vector Outline)</h4>
                <canvas id="cutCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const DPI = 300; 
    const MM_TO_PX = (mm) => Math.round((mm * DPI) / 25.4);
    let uploadedStickers = [];
    let pagesData = []; 
    let currentPageIndex = 0;
    let currentSheetW_mm = 297, currentSheetH_mm = 420;

    function toggleCustomSize() {
        const select = document.getElementById('sheetSize');
        document.getElementById('customDimensions').style.display = (select.value === 'custom') ? 'grid' : 'none';
    }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const ratio = img.height / img.width;
                    const defaultWidth = 50;
                    const defaultHeight = Math.round(defaultWidth * ratio);

                    uploadedStickers.push({
                        id: Date.now() + Math.random(),
                        img: img,
                        filename: file.name,
                        widthMm: defaultWidth,
                        heightMm: defaultHeight,
                        aspectRatio: ratio,
                        qty: 10
                    });

                    renderStickerList();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        e.target.value = '';
    }

    function renderStickerList() {
        const container = document.getElementById('stickerList');
        document.getElementById('itemCount').innerText = `${uploadedStickers.length} item`;

        if (uploadedStickers.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada gambar yang di-upload.</div>';
            return;
        }

        container.innerHTML = '';
        uploadedStickers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.innerHTML = `
                <button class="btn-delete" title="Hapus" onclick="removeItem(${index})">×</button>
                <img src="${item.img.src}" class="sticker-thumb">
                <div class="sticker-details">
                    <div class="sticker-filename">${item.filename}</div>
                    <div class="sticker-inputs">
                        <div>
                            <label>L (mm)</label>
                            <input type="number" value="${item.widthMm}" oninput="updateItemSize(${index}, 'width', this.value)">
                        </div>
                        <div>
                            <label>T (mm)</label>
                            <input type="number" value="${item.heightMm}" oninput="updateItemSize(${index}, 'height', this.value)">
                        </div>
                        <div>
                            <label>Qty</label>
                            <input type="number" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function updateItemSize(index, changedProp, val) {
        const numVal = parseFloat(val);
        if (isNaN(numVal) || numVal <= 0) return;

        const item = uploadedStickers[index];
        if (changedProp === 'width') {
            item.widthMm = numVal;
            item.heightMm = Math.round(numVal * item.aspectRatio);
        } else if (changedProp === 'height') {
            item.heightMm = numVal;
            item.widthMm = Math.round(numVal / item.aspectRatio);
        }

        const items = document.querySelectorAll('.sticker-item');
        if (items[index]) {
            const inputs = items[index].querySelectorAll('.sticker-inputs input');
            inputs[0].value = item.widthMm;
            inputs[1].value = item.heightMm;
        }
    }

    function updateQty(index, val) {
        uploadedStickers[index].qty = Math.max(1, parseInt(val) || 1);
    }

    function removeItem(index) {
        uploadedStickers.splice(index, 1);
        renderStickerList();
    }

    function drawStrokeOnly(cCtx, img, x, y, w, h) {
        const tempC = document.createElement('canvas');
        tempC.width = w; tempC.height = h;
        const tempCtx = tempC.getContext('2d');
        tempCtx.drawImage(img, 0, 0, w, h);

        const imgData = tempCtx.getImageData(0, 0, w, h);
        const d = imgData.data;

        const outlineC = document.createElement('canvas');
        outlineC.width = w; outlineC.height = h;
        const oCtx = outlineC.getContext('2d');
        const oData = oCtx.createImageData(w, h);
        const od = oData.data;

        for (let py = 0; py < h; py++) {
            for (let px = 0; px < w; px++) {
                const idx = (py * w + px) * 4;
                if (d[idx + 3] > 20) {
                    let isEdge = false;
                    if (px === 0 || px === w - 1 || py === 0 || py === h - 1) {
                        isEdge = true;
                    } else {
                        const topA = d[((py - 1) * w + px) * 4 + 3];
                        const botA = d[((py + 1) * w + px) * 4 + 3];
                        const leftA = d[(py * w + (px - 1)) * 4 + 3];
                        const rightA = d[(py * w + (px + 1)) * 4 + 3];
                        if (topA <= 20 || botA <= 20 || leftA <= 20 || rightA <= 20) isEdge = true;
                    }

                    if (isEdge) {
                        od[idx] = 230;     
                        od[idx + 1] = 50;  
                        od[idx + 2] = 50;  
                        od[idx + 3] = 255; 
                    }
                }
            }
        }
        oCtx.putImageData(oData, 0, 0);
        cCtx.drawImage(outlineC, x, y);
    }

    function getContourSVGPath(img, targetW_mm, targetH_mm, offsetX_mm, offsetY_mm) {
        const tempC = document.createElement('canvas');
        tempC.width = 150; 
        tempC.height = Math.round(150 * (img.height / img.width));
        const ctx = tempC.getContext('2d');
        ctx.drawImage(img, 0, 0, tempC.width, tempC.height);

        const w = tempC.width;
        const h = tempC.height;
        const imgData = ctx.getImageData(0, 0, w, h).data;

        let points = [];
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const alpha = imgData[(y * w + x) * 4 + 3];
                if (alpha > 20) {
                    let isEdge = false;
                    if (x === 0 || x === w - 1 || y === 0 || y === h - 1) {
                        isEdge = true;
                    } else {
                        const aTop = imgData[((y - 1) * w + x) * 4 + 3];
                        const aBot = imgData[((y + 1) * w + x) * 4 + 3];
                        const aLeft = imgData[(y * w + (x - 1)) * 4 + 3];
