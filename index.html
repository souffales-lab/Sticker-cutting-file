<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Sheet & Cutline Studio ✨</title>
    <!-- Google Fonts khas Souffales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- JSZip & FileSaver untuk Multi-Page Download ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFFDF0;
            --card-bg: #FFFFFF;
            --accent-yellow: #FDE8AF;
            --brown-text: #785A46;
            --brown-dark: #5C4333;
            --brown-btn: #A0785C;
            --brown-btn-hover: #8A644A;
            --border-dashed: #E2CFB4;
            --border-solid: #EFE4D3;
            --danger: #E57373;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-cream);
            color: var(--brown-text);
            line-height: 1.5;
            padding: 24px 16px;
        }

        .header-title { text-align: center; margin-bottom: 24px; }
        .header-title h1 { 
            font-family: 'Fredoka', cursive;
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--brown-dark); 
        }
        .header-title p { color: var(--brown-text); font-size: 0.95rem; margin-top: 4px; font-weight: 600; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-solid);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(120, 90, 70, 0.05);
        }

        .card-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brown-dark);
        }

        .section-subtitle {
            font-family: 'Fredoka', cursive;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--border-dashed);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--brown-dark);
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        label {
            display: block;
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--brown-text);
            letter-spacing: 0.02em;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-solid);
            background-color: var(--card-cream);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: var(--brown-dark);
            font-weight: 700;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--brown-btn);
            background-color: #FFFFFF;
        }

        .custom-dimensions {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: var(--card-cream);
            border: 1.5px dashed var(--border-dashed);
            border-radius: var(--radius-md);
        }

        .btn-upload-box {
            border: 2px dashed var(--border-dashed);
            color: var(--brown-dark);
            background-color: var(--card-cream);
            padding: 16px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            display: block;
            transition: all 0.2s ease;
        }

        .btn-upload-box:hover { background-color: var(--accent-yellow); }

        .sticker-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .sticker-item {
            position: relative;
            background: var(--card-cream);
            border: 1.5px solid var(--border-solid);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sticker-thumb-wrapper {
            width: 54px;
            height: 54px;
            background: #FFFFFF;
            border: 1px solid var(--border-solid);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-image: linear-gradient(45deg, #f7efe5 25%, transparent 25%), linear-gradient(-45deg, #f7efe5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f7efe5 75%), linear-gradient(-45deg, transparent 75%, #f7efe5 75%);
            background-size: 8px 8px;
        }

        .sticker-thumb-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .sticker-details { flex-grow: 1; }
        .sticker-filename { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: var(--brown-dark); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sticker-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .sticker-inputs label { font-size: 0.7rem; margin-bottom: 2px; }
        .sticker-inputs input { padding: 6px 8px; font-size: 0.85rem; border-radius: var(--radius-sm); }

        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: var(--brown-dark);
            border: none;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-delete:hover { background: var(--danger); color: #FFF; }

        .btn {
            background: var(--brown-btn);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 var(--brown-dark);
        }

        .btn:hover { background: var(--brown-btn-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        .download-bar { display: none; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .download-row { display: flex; gap: 10px; }
        .download-bar .btn { margin-top: 0; flex: 1; font-size: 0.88rem; padding: 12px 8px; }
        .btn-success { background: #7CA982; box-shadow: 0 4px 0 #5B8361; }
        .btn-success:hover { background: #6B9871; }
        .btn-danger { background: #D98880; box-shadow: 0 4px 0 #B5655D; }
        .btn-danger:hover { background: #C7776F; }
        .btn-zip { background: #E5A93C; box-shadow: 0 4px 0 #B37E20; }
        .btn-zip:hover { background: #D6972B; }

        /* Pagination Control */
        .pagination-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--card-cream);
            padding: 10px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-solid);
            margin-bottom: 16px;
        }

        .page-btn {
            background: var(--brown-btn);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .page-info { font-family: 'Fredoka', cursive; font-weight: 600; color: var(--brown-dark); font-size: 0.95rem; }

        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .preview-grid { grid-template-columns: 1fr; } }

        .preview-box { background: var(--card-cream); border: 2px solid var(--border-solid); border-radius: var(--radius-lg); padding: 14px; text-align: center; }
        .preview-box h4 { font-family: 'Fredoka', cursive; font-size: 0.9rem; color: var(--brown-text); margin-bottom: 8px; }
        canvas { max-width: 100%; height: auto; border: 2px solid var(--border-solid); border-radius: var(--radius-md); background: #FFF; }
        .empty-state { color: var(--brown-text); font-size: 0.85rem; text-align: center; padding: 20px 0; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-title">
    <h1>✂️ Sticker Layout Studio ✨</h1>
    <p>Susun stiker otomatis ke banyak lembar & ekspor vector SVG cutting line</p>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">⚙️ Pengaturan Lembar</div>
        
        <div class="form-group">
            <label>Ukuran Kertas / Area Cetak</label>
            <select id="sheetSize" onchange="toggleCustomSize()">
                <option value="A4">A4 Standard (210 x 297 mm)</option>
                <option value="A4_Vendor">A4 Area Cetak Vendor (190 x 277 mm)</option>
                <option value="A3" selected>A3 Standard (297 x 420 mm)</option>
                <option value="A3Plus">A3+ Standard (329 x 483 mm)</option>
                <option value="A3Plus_Vendor">A3+ Area Cetak Vendor (300 x 450 mm)</option>
                <option value="custom">✨ Custom Size (Input Sendiri)</option>
            </select>
        </div>

        <div id="customDimensions" class="custom-dimensions form-row">
            <div class="form-group" style="margin-bottom:0;">
                <label>Lebar Area Cetak (mm)</label>
                <input type="number" id="customWidth" value="200" placeholder="Lebar mm">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Tinggi Area Cetak (mm)</label>
                <input type="number" id="customHeight" value="300" placeholder="Tinggi mm">
            </div>
        </div>

        <div class="form-row" style="margin-top: 12px;">
            <div class="form-group">
                <label>Margin (mm)</label>
                <input type="number" id="sheetMargin" value="10">
            </div>
            <div class="form-group">
                <label>Jarak Stiker (mm)</label>
                <input type="number" id="stickerGap" value="3">
            </div>
        </div>

        <div class="section-subtitle">
            <span>🖼️ Upload Stiker</span>
        </div>

        <div class="form-group">
            <label class="btn-upload-box" for="fileInput">
                📁 Klik Di Sini Untuk Pilih Gambar (PNG)
            </label>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        </div>

        <div class="section-subtitle">
            <span>📋 Daftar Desain</span>
            <span id="itemCount" style="font-size:0.75rem; color:var(--brown-text);">0 item</span>
        </div>

        <div id="stickerList" class="sticker-list">
            <div class="empty-state">Belum ada gambar yang di-upload.</div>
        </div>

        <button class="btn" onclick="generateLayout()">✨ Generate Multi-Page Layout</button>
    </div>

    <div class="card">
        <div class="card-title">👁️ Preview & Download</div>

        <!-- Navigasi Lembar -->
        <div id="pagination" class="pagination-container">
            <button id="prevPageBtn" class="page-btn" onclick="changePage(-1)">◀ Lembar Sebelum</button>
            <span id="pageIndicator" class="page-info">Lembar 1 dari 1</span>
            <button id="nextPageBtn" class="page-btn" onclick="changePage(1)">Lembar Berikut ▶</button>
        </div>

        <div id="actionButtons" class="download-bar">
            <div class="download-row">
                <button class="btn btn-success" onclick="downloadCetakCurrent()">📥 Lembar Ini (PNG)</button>
                <button class="btn btn-danger" onclick="downloadCuttingCurrent()">✂️ Cutting Lembar Ini (SVG)</button>
            </div>
            <button class="btn btn-zip" onclick="downloadAllZip()">📦 Download Semua Lembar (ZIP)</button>
        </div>

        <div class="preview-grid">
            <div class="preview-box">
                <h4>Preview Hasil Cetak</h4>
                <canvas id="printCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h4>Preview Line Cutting (Stroke Vector)</h4>
                <canvas id="cutCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const DPI = 300; 
    const MM_TO_PX = (mm) => Math.round((mm * DPI) / 25.4);
    let uploadedStickers = [];
    
    // Multi-page stores
    let pagesData = []; // Array simpan data tiap halaman { printCanvas, cutCanvas, svgContent }
    let currentPageIndex = 0;
    let currentSheetW_mm = 297, currentSheetH_mm = 420;

    function toggleCustomSize() {
        const select = document.getElementById('sheetSize');
        const customDiv = document.getElementById('customDimensions');
        customDiv.style.display = (select.value === 'custom') ? 'grid' : 'none';
    }

    function cropTransparentPixels(img) {
        const tempC = document.createElement('canvas');
        tempC.width = img.width;
        tempC.height = img.height;
        const ctx = tempC.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        const data = imgData.data;

        let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
        let found = false;

        for (let y = 0; y < img.height; y++) {
            for (let x = 0; x < img.width; x++) {
                const alpha = data[(y * img.width + x) * 4 + 3];
                if (alpha > 10) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                    found = true;
                }
            }
        }

        if (!found) return img;

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;

        const croppedC = document.createElement('canvas');
        croppedC.width = cropW;
        croppedC.height = cropH;
        const croppedCtx = croppedC.getContext('2d');
        croppedCtx.drawImage(tempC, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        const croppedImg = new Image();
        croppedImg.src = croppedC.toDataURL();
        return { img: croppedImg, width: cropW, height: cropH, originalCanvas: croppedC };
    }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        files.forEach(file => {
            const rawImg = new Image();
            const objectUrl = URL.createObjectURL(file);
            
            rawImg.onload = function() {
                const cropped = cropTransparentPixels(rawImg);
                
                cropped.img.onload = function() {
                    const ratio = cropped.height / cropped.width;
                    const defaultWidth = 50;
                    const defaultHeight = Math.round(defaultWidth * ratio);

                    uploadedStickers.push({
                        id: Date.now() + Math.random(),
                        img: cropped.img,
                        canvas: cropped.originalCanvas,
                        filename: file.name,
                        widthMm: defaultWidth,
                        heightMm: defaultHeight,
                        aspectRatio: ratio,
                        qty: 10
                    });

                    renderStickerList();
                };
            };
            rawImg.src = objectUrl;
        });
        
        e.target.value = '';
    }

    function renderStickerList() {
        const container = document.getElementById('stickerList');
        const countSpan = document.getElementById('itemCount');
        countSpan.innerText = `${uploadedStickers.length} item`;

        if (uploadedStickers.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada gambar yang di-upload.</div>';
            return;
        }

        container.innerHTML = '';
        uploadedStickers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.innerHTML = `
                <button class="btn-delete" title="Hapus" onclick="removeItem(${index})">×</button>
                <div class="sticker-thumb-wrapper">
                    <img src="${item.img.src}">
                </div>
                <div class="sticker-details">
                    <div class="sticker-filename">${item.filename}</div>
                    <div class="sticker-inputs">
                        <div>
                            <label>L (mm)</label>
                            <input type="number" value="${item.widthMm}" oninput="updateItemSize(${index}, 'width', this.value)">
                        </div>
                        <div>
                            <label>T (mm)</label>
                            <input type="number" value="${item.heightMm}" oninput="updateItemSize(${index}, 'height', this.value)">
                        </div>
                        <div>
                            <label>Qty</label>
                            <input type="number" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function updateItemSize(index, changedProp, val) {
        const numVal = parseFloat(val);
        if (isNaN(numVal) || numVal <= 0) return;

        const item = uploadedStickers[index];
        if (changedProp === 'width') {
            item.widthMm = numVal;
            item.heightMm = Math.round(numVal * item.aspectRatio);
        } else if (changedProp === 'height') {
            item.heightMm = numVal;
            item.widthMm = Math.round(numVal / item.aspectRatio);
        }

        const items = document.querySelectorAll('.sticker-item');
        if (items[index
