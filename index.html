<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Sheet & Cutline Studio ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFFDF0;
            --card-bg: #FFFFFF;
            --accent-yellow: #FDE8AF;
            --brown-text: #785A46;
            --brown-dark: #5C4333;
            --brown-btn: #A0785C;
            --brown-btn-hover: #8A644A;
            --border-dashed: #E2CFB4;
            --border-solid: #EFE4D3;
            --danger: #E57373;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-cream);
            color: var(--brown-text);
            line-height: 1.5;
            padding: 24px 16px;
        }

        .header-title { text-align: center; margin-bottom: 24px; }
        .header-title h1 { 
            font-family: 'Fredoka', cursive;
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--brown-dark); 
        }
        .header-title p { color: var(--brown-text); font-size: 0.95rem; margin-top: 4px; font-weight: 600; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-solid);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(120, 90, 70, 0.05);
        }

        .card-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brown-dark);
        }

        .section-subtitle {
            font-family: 'Fredoka', cursive;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--border-dashed);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--brown-dark);
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        label {
            display: block;
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--brown-text);
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-solid);
            background-color: var(--card-cream);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: var(--brown-dark);
            font-weight: 700;
            outline: none;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--card-cream);
            border: 2px dashed var(--border-dashed);
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            color: var(--brown-dark);
            cursor: pointer;
        }

        .custom-dimensions {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: var(--card-cream);
            border: 1.5px dashed var(--border-dashed);
            border-radius: var(--radius-md);
        }

        .sticker-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
        }

        .sticker-item {
            position: relative;
            background: var(--card-cream);
            border: 1.5px solid var(--border-solid);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sticker-thumb {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-solid);
        }

        .sticker-details { flex-grow: 1; }
        .sticker-filename { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: var(--brown-dark); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sticker-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .sticker-inputs label { font-size: 0.7rem; margin-bottom: 2px; }
        .sticker-inputs input { padding: 6px 8px; font-size: 0.85rem; border-radius: var(--radius-sm); }

        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: var(--brown-dark);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete:hover { background: var(--danger); color: #FFF; }

        .btn {
            background: var(--brown-btn);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 0 var(--brown-dark);
        }

        .btn:hover { background: var(--brown-btn-hover); }

        .download-bar { display: none; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .download-row { display: flex; gap: 10px; }
        .download-bar .btn { margin-top: 0; flex: 1; font-size: 0.88rem; padding: 12px 8px; }
        .btn-success { background: #7CA982; box-shadow: 0 4px 0 #5B8361; }
        .btn-danger { background: #D98880; box-shadow: 0 4px 0 #B5655D; }

        .pagination-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--card-cream);
            padding: 10px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-solid);
            margin-bottom: 16px;
        }

        .page-btn {
            background: var(--brown-btn);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-family: 'Fredoka', cursive;
            cursor: pointer;
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .preview-grid { grid-template-columns: 1fr; } }

        .preview-box { background: var(--card-cream); border: 2px solid var(--border-solid); border-radius: var(--radius-lg); padding: 14px; text-align: center; }
        .preview-box h4 { font-family: 'Fredoka', cursive; font-size: 0.9rem; color: var(--brown-text); margin-bottom: 8px; }
        canvas { max-width: 100%; height: auto; border: 2px solid var(--border-solid); border-radius: var(--radius-md); background: #FFF; }
        .empty-state { color: var(--brown-text); font-size: 0.85rem; text-align: center; padding: 20px 0; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-title">
    <h1>✂️ Sticker Layout Studio ✨</h1>
    <p>Susun stiker otomatis ke banyak lembar & preview cutting line vector</p>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">⚙️ Pengaturan Lembar</div>
        
        <div class="form-group">
            <label>Ukuran Kertas / Area Cetak</label>
            <select id="sheetSize">
                <option value="A4">A4 Standard (210 x 297 mm)</option>
                <option value="A4_Vendor">A4 Area Cetak Vendor (190 x 277 mm)</option>
                <option value="A3" selected>A3 Standard (297 x 420 mm)</option>
                <option value="A3Plus">A3+ Standard (329 x 483 mm)</option>
                <option value="A3Plus_Vendor">A3+ Area Cetak Vendor (300 x 450 mm)</option>
                <option value="custom">✨ Custom Size (Input Sendiri)</option>
            </select>
        </div>

        <div id="customDimensions" class="custom-dimensions form-row">
            <div class="form-group" style="margin-bottom:0;">
                <label>Lebar Area (mm)</label>
                <input type="number" id="customWidth" value="200">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Tinggi Area (mm)</label>
                <input type="number" id="customHeight" value="300">
            </div>
        </div>

        <div class="form-row" style="margin-top: 12px;">
            <div class="form-group">
                <label>Margin (mm)</label>
                <input type="number" id="sheetMargin" value="10">
            </div>
            <div class="form-group">
                <label>Jarak Stiker (mm)</label>
                <input type="number" id="stickerGap" value="3">
            </div>
        </div>

        <div class="section-subtitle">
            <span>🖼️ Upload Stiker</span>
        </div>

        <div class="form-group">
            <label for="fileInput">Pilih File PNG Stiker:</label>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>

        <div class="section-subtitle">
            <span>📋 Daftar Desain</span>
            <span id="itemCount" style="font-size:0.75rem; color:var(--brown-text);">0 item</span>
        </div>

        <div id="stickerList" class="sticker-list">
            <div class="empty-state">Belum ada gambar yang di-upload.</div>
        </div>

        <button class="btn" id="btnGenerate">✨ Generate Multi-Page Layout</button>
    </div>

    <div class="card">
        <div class="card-title">👁️ Preview & Download</div>

        <div id="pagination" class="pagination-container">
            <button id="prevPageBtn" class="page-btn">◀ Lembar Sebelum</button>
            <span id="pageIndicator" style="font-family:'Fredoka'; font-weight:600;">Lembar 1 dari 1</span>
            <button id="nextPageBtn" class="page-btn">Lembar Berikut ▶</button>
        </div>

        <div id="actionButtons" class="download-bar">
            <div class="download-row">
                <button class="btn btn-success" id="btnDownloadPNG">📥 Download Cetak Lembar Ini (PNG)</button>
                <button class="btn btn-danger" id="btnDownloadSVG">✂️ Download Cutting Lembar Ini (SVG)</button>
            </div>
        </div>

        <div class="preview-grid">
            <div class="preview-box">
                <h4>Preview Hasil Cetak</h4>
                <canvas id="printCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h4>Preview Line Cutting (Vector Contour)</h4>
                <canvas id="cutCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const DPI = 300; 
    const MM_TO_PX = (mm) => Math.round((mm * DPI) / 25.4);
    let uploadedStickers = [];
    let pagesData = []; 
    let currentPageIndex = 0;
    let currentSheetW_mm = 297, currentSheetH_mm = 420;

    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('fileInput');
        const sheetSizeSelect = document.getElementById('sheetSize');
        const btnGenerate = document.getElementById('btnGenerate');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const btnDownloadPNG = document.getElementById('btnDownloadPNG');
        const btnDownloadSVG = document.getElementById('btnDownloadSVG');

        sheetSizeSelect.addEventListener('change', () => {
            document.getElementById('customDimensions').style.display = (sheetSizeSelect.value === 'custom') ? 'grid' : 'none';
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            let loaded = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const bounds = getVisibleBounds(img);
                        const ratio = img.height / img.width;
                        const defaultWidth = 50;
                        const defaultHeight = Math.round(defaultWidth * ratio);

                        uploadedStickers.push({
                            id: Date.now() + Math.random(),
                            img: img,
                            bounds: bounds, // Menyimpan batas area gambar asli non-transparan
                            filename: file.name,
                            widthMm: defaultWidth,
                            heightMm: defaultHeight,
                            aspectRatio: ratio,
                            qty: 10
                        });

                        loaded++;
                        if (loaded === files.length) {
                            renderStickerList();
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        btnGenerate.addEventListener('click', generateLayout);
        prevPageBtn.addEventListener('click', () => changePage(-1));
        nextPageBtn.addEventListener('click', () => changePage(1));
        btnDownloadPNG.addEventListener('click', downloadCetakCurrent);
        btnDownloadSVG.addEventListener('click', downloadCuttingCurrent);
    });

    // Fungsi untuk mendeteksi batas transparan (alpha > 10) agar cutline pas melingkar/mengikuti bentuk karakter
    function getVisibleBounds(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, img.width, img.height).data;

        let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
        let found = false;

        for (let y = 0; y < img.height; y++) {
            for (let x = 0; x < img.width; x++) {
                const alpha = data[(y * img.width + x) * 4 + 3];
                if (alpha > 10) { // Piksel tidak transparan
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                    found = true;
                }
            }
        }

        if (!found) return { x: 0, y: 0, w: img.width, h: img.height };
        return {
            x: minX,
            y: minY,
            w: (maxX - minX + 1),
            h: (maxY - minY + 1)
        };
    }

    function renderStickerList() {
        const container = document.getElementById('stickerList');
        document.getElementById('itemCount').innerText = `${uploadedStickers.length} item`;

        if (uploadedStickers.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada gambar yang di-upload.</div>';
            return;
        }

        container.innerHTML = '';
        uploadedStickers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.innerHTML = `
                <button class="btn-delete" title="Hapus" data-index="${index}">×</button>
                <img src="${item.img.src}" class="sticker-thumb">
                <div class="sticker-details">
                    <div class="sticker-filename">${item.filename}</div>
                    <div class="sticker-inputs">
                        <div>
                            <label>L (mm)</label>
                            <input type="number" class="input-w" value="${item.widthMm}" data-index="${index}">
                        </div>
                        <div>
                            <label>T (mm)</label>
                            <input type="number" class="input-h" value="${item.heightMm}" data-index="${index}">
                        </div>
                        <div>
                            <label>Qty</label>
                            <input type="number" class="input-q" value="${item.qty}" min="1" data-index="${index}">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        container.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                uploadedStickers.splice(idx, 1);
                renderStickerList();
            });
        });

        container.querySelectorAll('.input-w').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                updateItemSize(idx, 'width', e.target.value);
            });
        });

        container.querySelectorAll('.input-h').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                updateItemSize(idx, 'height', e.target.value);
            });
        });

        container.querySelectorAll('.input-q').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                uploadedStickers[idx].qty = Math.max(1, parseInt(e.target.value) || 1);
            });
        });
    }

    function updateItemSize(index, changedProp, val) {
        const numVal = parseFloat(val);
        if (isNaN(numVal) || numVal <= 0) return;

        const item = uploadedStickers[index];
        if (changedProp === 'width') {
            item.widthMm = numVal;
            item.heightMm = Math.round(numVal * item.aspectRatio);
        } else if (changedProp === 'height') {
            item.heightMm = numVal;
            item.widthMm = Math.round(numVal / item.aspectRatio);
        }

        const items = document.querySelectorAll('.sticker-item');
        if (items[index]) {
            items[index].querySelector('.input-w').value = item.widthMm;
            items[index].querySelector('.input-h').value = item.heightMm;
        }
    }

    // Menggambar cutline presisi pas di sekeliling bentuk gambar (mengabaikan background transparan)
    function drawContourCut(cCtx, item, drawX, drawY, itemW, itemH) {
        const scaleX = itemW / item.img.width;
