<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Layout & Contour Studio ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFFDF0;
            --card-bg: #FFFFFF;
            --accent-yellow: #FDE8AF;
            --brown-text: #785A46;
            --brown-dark: #5C4333;
            --brown-btn: #A0785C;
            --brown-btn-hover: #8A644A;
            --border-dashed: #E2CFB4;
            --border-solid: #EFE4D3;
            --danger: #E57373;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-cream);
            color: var(--brown-text);
            line-height: 1.5;
            padding: 24px 16px;
        }

        .header-title { text-align: center; margin-bottom: 24px; }
        .header-title h1 { 
            font-family: 'Fredoka', cursive;
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--brown-dark); 
        }
        .header-title p { color: var(--brown-text); font-size: 0.95rem; margin-top: 4px; font-weight: 600; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-solid);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(120, 90, 70, 0.05);
        }

        .card-title {
            font-family: 'Fredoka', cursive;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--brown-dark);
        }

        .section-subtitle {
            font-family: 'Fredoka', cursive;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 20px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--border-dashed);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--brown-dark);
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        label {
            display: block;
            font-family: 'Fredoka', cursive;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--brown-text);
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-solid);
            background-color: var(--card-cream);
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: var(--brown-dark);
            font-weight: 700;
            outline: none;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--card-cream);
            border: 2px dashed var(--border-dashed);
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            color: var(--brown-dark);
            cursor: pointer;
        }

        .custom-dimensions {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: var(--card-cream);
            border: 1.5px dashed var(--border-dashed);
            border-radius: var(--radius-md);
        }

        .sticker-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
        }

        .sticker-item {
            position: relative;
            background: var(--card-cream);
            border: 1.5px solid var(--border-solid);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .sticker-thumb {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-solid);
        }

        .sticker-details { flex-grow: 1; }
        .sticker-filename { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; color: var(--brown-dark); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sticker-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .sticker-inputs label { font-size: 0.7rem; margin-bottom: 2px; }
        .sticker-inputs input { padding: 6px 8px; font-size: 0.85rem; border-radius: var(--radius-sm); }

        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-yellow);
            color: var(--brown-dark);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete:hover { background: var(--danger); color: #FFF; }

        .btn {
            background: var(--brown-btn);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-family: 'Fredoka', cursive;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 0 var(--brown-dark);
        }

        .btn:hover { background: var(--brown-btn-hover); }

        .download-bar { display: none; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .download-row { display: flex; gap: 10px; }
        .download-bar .btn { margin-top: 0; flex: 1; font-size: 0.88rem; padding: 12px 8px; }
        .btn-success { background: #7CA982; box-shadow: 0 4px 0 #5B8361; }
        .btn-danger { background: #D98880; box-shadow: 0 4px 0 #B5655D; }

        .pagination-container {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--card-cream);
            padding: 10px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-solid);
            margin-bottom: 16px;
        }

        .page-btn {
            background: var(--brown-btn);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-family: 'Fredoka', cursive;
            cursor: pointer;
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .preview-grid { grid-template-columns: 1fr; } }

        .preview-box { background: var(--card-cream); border: 2px solid var(--border-solid); border-radius: var(--radius-lg); padding: 14px; text-align: center; }
        .preview-box h4 { font-family: 'Fredoka', cursive; font-size: 0.9rem; color: var(--brown-text); margin-bottom: 8px; }
        canvas { max-width: 100%; height: auto; border: 2px solid var(--border-solid); border-radius: var(--radius-md); background: #FFF; }
        .empty-state { color: var(--brown-text); font-size: 0.85rem; text-align: center; padding: 20px 0; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-title">
    <h1>✂️ Sticker Layout & Contour Studio ✨</h1>
    <p>Auto-Trim Transparan & Garis Potong Presisi Sesuai Siluet Karakter</p>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">⚙️ Pengaturan Lembar</div>
        
        <div class="form-group">
            <label>Ukuran Kertas / Area Cetak</label>
            <select id="sheetSize">
                <option value="A4">A4 Standard (210 x 297 mm)</option>
                <option value="A4_Vendor">A4 Area Cetak Vendor (190 x 277 mm)</option>
                <option value="A3" selected>A3 Standard (297 x 420 mm)</option>
                <option value="A3Plus">A3+ Standard (329 x 483 mm)</option>
                <option value="A3Plus_Vendor">A3+ Area Cetak Vendor (300 x 450 mm)</option>
                <option value="custom">✨ Custom Size (Input Sendiri)</option>
            </select>
        </div>

        <div id="customDimensions" class="custom-dimensions form-row">
            <div class="form-group" style="margin-bottom:0;">
                <label>Lebar Area (mm)</label>
                <input type="number" id="customWidth" value="200">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Tinggi Area (mm)</label>
                <input type="number" id="customHeight" value="300">
            </div>
        </div>

        <div class="form-row" style="margin-top: 12px;">
            <div class="form-group">
                <label>Margin (mm)</label>
                <input type="number" id="sheetMargin" value="10">
            </div>
            <div class="form-group">
                <label>Jarak Stiker (mm)</label>
                <input type="number" id="stickerGap" value="3">
            </div>
        </div>

        <div class="section-subtitle">
            <span>🖼️ Upload Stiker</span>
        </div>

        <div class="form-group">
            <label for="fileInput">Pilih File PNG Stiker (Transparan):</label>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>

        <div class="section-subtitle">
            <span>📋 Daftar Desain</span>
            <span id="itemCount" style="font-size:0.75rem; color:var(--brown-text);">0 item</span>
        </div>

        <div id="stickerList" class="sticker-list">
            <div class="empty-state">Belum ada gambar yang di-upload.</div>
        </div>

        <button class="btn" id="btnGenerate">✨ Generate Layout & Cutline</button>
    </div>

    <div class="card">
        <div class="card-title">👁️ Preview & Download</div>

        <div id="pagination" class="pagination-container">
            <button id="prevPageBtn" class="page-btn">◀ Lembar Sebelum</button>
            <span id="pageIndicator" style="font-family:'Fredoka'; font-weight:600;">Lembar 1 dari 1</span>
            <button id="nextPageBtn" class="page-btn">Lembar Berikut ▶</button>
        </div>

        <div id="actionButtons" class="download-bar">
            <div class="download-row">
                <button class="btn btn-success" id="btnDownloadPNG">📥 Download Cetak Lembar Ini (PNG)</button>
                <button class="btn btn-danger" id="btnDownloadSVG">✂️ Download Cutting Contour (SVG)</button>
            </div>
        </div>

        <div class="preview-grid">
            <div class="preview-box">
                <h4>Preview Hasil Cetak</h4>
                <canvas id="printCanvas"></canvas>
            </div>
            <div class="preview-box">
                <h4>Preview Line Cutting (Contour Vector)</h4>
                <canvas id="cutCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const DPI = 300; 
    const MM_TO_PX = (mm) => Math.round((mm * DPI) / 25.4);
    let uploadedStickers = [];
    let pagesData = []; 
    let currentPageIndex = 0;
    let currentSheetW_mm = 297, currentSheetH_mm = 420;

    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('fileInput');
        const sheetSizeSelect = document.getElementById('sheetSize');
        const btnGenerate = document.getElementById('btnGenerate');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const btnDownloadPNG = document.getElementById('btnDownloadPNG');
        const btnDownloadSVG = document.getElementById('btnDownloadSVG');

        sheetSizeSelect.addEventListener('change', () => {
            document.getElementById('customDimensions').style.display = (sheetSizeSelect.value === 'custom') ? 'grid' : 'none';
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            let loaded = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        // 1. AUTO-TRIM: Otomatis buang area transparan luar, ambil batas objek sesungguhnya
                        const trimmedData = autoTrimImage(img);
                        
                        const ratio = trimmedData.height / trimmedData.width;
                        const defaultWidth = 50; // Default 50mm berdasarkan objek terpangkas
                        const defaultHeight = Math.round(defaultWidth * ratio);

                        uploadedStickers.push({
                            id: Date.now() + Math.random(),
                            trimmedCanvas: trimmedData.canvas, // Canvas objek yang sudah dipangkas bersih
                            filename: file.name,
                            widthMm: defaultWidth,
                            heightMm: defaultHeight,
                            aspectRatio: ratio,
                            qty: 10,
                            contourPoints: trimmedData.contourPoints // Titik kontur relatif dari area yang sudah bersih
                        });

                        loaded++;
                        if (loaded === files.length) {
                            renderStickerList();
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        btnGenerate.addEventListener('click', generateLayout);
        prevPageBtn.addEventListener('click', () => changePage(-1));
        nextPageBtn.addEventListener('click', () => changePage(1));
        btnDownloadPNG.addEventListener('click', downloadCetakCurrent);
        btnDownloadSVG.addEventListener('click', downloadCuttingCurrent);
    });

    // Fungsi otomatis mendeteksi batas pixel tidak transparan (membuang ruang kosong/padding transparan luar)
    function autoTrimImage(img) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width;
        tempCanvas.height = img.height;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(img, 0, 0);
        const imgData = tCtx.getImageData(0, 0, img.width, img.height);
        const data = imgData.data;

        let minX = img.width, minY = img.height, maxX = 0, maxY = 0;

        // Cari batas kotak objek terluar yang memiliki alpha > 30
        for (let y = 0; y < img.height; y++) {
            for (let x = 0; x < img.width; x++) {
                const alpha = data[(y * img.width + x) * 4 + 3];
                if (alpha > 30) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        // Jika gambar sepenuhnya transparan
        if (minX > maxX || minY > maxY) {
            minX = 0; minY = 0; maxX = img.width; maxY = img.height;
        }

        const cropWidth = maxX - minX + 1;
        const cropHeight = maxY - minY + 1;

        // Buat canvas baru khusus area objek yang sudah dipangkas (trimmed)
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = cropWidth;
        finalCanvas.height = cropHeight;
        const fCtx = finalCanvas.getContext('2d');
        fCtx.drawImage(tempCanvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

        // Ekstrak titik kontur siluet tepat dari canvas yang sudah dipangkas
        const trimmedData = fCtx.getImageData(0, 0, cropWidth, cropHeight);
        const tPixels = trimmedData.data;
        const step = Math.max(1, Math.floor(Math.min(cropWidth, cropHeight) / 100));
        let outerPoints = [];

        for (let y = 0; y < cropHeight; y += step) {
            let leftX = -1, rightX = -1;
            for (let x = 0; x < cropWidth; x++) {
                if (tPixels[(y * cropWidth + x) * 4 + 3] > 30) { leftX = x; break; }
            }
            for (let x = cropWidth - 1; x >= 0; x--) {
                if (tPixels[(y * cropWidth + x) * 4 + 3] > 30) { rightX = x; break; }
            }
            if (leftX !== -1) outerPoints.push({ x: leftX, y: y });
        }

        for (let x = cropWidth - 1; x >= 0; x -= step) {
            let bottomY = -1;
            for (let y = cropHeight - 1; y >= 0; y--) {
                if (tPixels[(y * cropWidth + x) * 4 + 3] > 30) { bottomY = y; break; }
            }
            if (bottomY !== -1) outerPoints.push({ x: x, y: bottomY });
        }

        for (let y = cropHeight - 1; y >= 0; y -= step) {
            let rightX2 = -1;
            for (let x = cropWidth - 1; x >= 0; x--) {
                if (tPixels[(y * cropWidth + x) * 4 + 3] > 30) { rightX2 = x; break; }
            }
            if (rightX2 !== -1) outerPoints.push({ x: rightX2, y: y });
        }

        const contourPoints = outerPoints.map(p => ({ x: p.x / cropWidth, y: p.y / cropHeight }));

        return {
            canvas: finalCanvas,
            width: cropWidth,
            height: cropHeight,
            contourPoints: contourPoints
        };
    }

    function renderStickerList() {
        const container = document.getElementById('stickerList');
        document.getElementById('itemCount').innerText = `${uploadedStickers.length} item`;

        if (uploadedStickers.length === 0) {
            container.innerHTML = '<div class="empty-state">Belum ada gambar yang di-upload.</div>';
            return;
        }

        container.innerHTML = '';
        uploadedStickers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sticker-item';
            div.innerHTML = `
                <button class="btn-delete" title="Hapus" data-index="${index}">×</button>
                <img src="${item.trimmedCanvas.toDataURL()}" class="sticker-thumb">
                <div class="sticker-details">
                    <div class="sticker-filename">${item.filename}</div>
                    <div class="sticker-inputs">
                        <div>
                            <label>L (mm)</label>
                            <input type="number" class="input-w" value="${item.widthMm}" data-index="${index}">
                        </div>
                        <div>
                            <label>T (mm)</label>
                            <input type="number" class="input-h" value="${item.heightMm}" data-index="${index}">
                        </div>
                        <div>
                            <label>Qty</label>
                            <input type="number" class="input-q" value="${item.qty}" min="1" data-index="${index}">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });

        container.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                uploadedStickers.splice(idx, 1);
                renderStickerList();
            });
        });

        container.querySelectorAll('.input-w').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                updateItemSize(idx, 'width', e.target.value);
            });
        });

        container.querySelectorAll('.input-h').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                updateItemSize(idx, 'height', e.target.value);
            });
        });

        container.querySelectorAll('.input-q').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                uploadedStickers[idx].qty = Math.max(1, parseInt(e.target.value) || 1);
            });
        });
    }

    function updateItemSize(index, changedProp, val) {
        const numVal = parseFloat(val);
        if (isNaN(numVal) || numVal <= 0) return;

        const item = uploadedStickers[index];
        if (changedProp === 'width') {
            item.widthMm = numVal;
            item.heightMm = Math.round(numVal * item.aspectRatio);
        } else if (changedProp === 'height') {
            item.heightMm = numVal;
            item.widthMm = Math.round(numVal / item.aspectRatio);
        }

        const items = document.querySelectorAll('.sticker-item');
        if (items[index]) {
            items[index].querySelector('.input-w').value = item.widthMm;
            items[index].querySelector('.input-h').value = item.heightMm;
        }
    }

    function createNewPage(sheetW, sheetH) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = sheetW; pCanvas.height = sheetH;
        const pCtx = pCanvas.getContext('2d');
        pCtx.fillStyle = '#FFFFFF'; pCtx.fillRect(0, 0, sheetW, sheetH);

        const cCanvas = document.createElement('canvas');
        cCanvas.width = sheetW; cCanvas.height = sheetH;
        const cCtx = cCanvas.getContext('2d');
        cCtx.fillStyle = '#FFFFFF'; cCtx.fillRect(0, 0, sheetW, sheetH);

        return {
            printCanvas: pCanvas,
            printCtx: pCtx,
            cutCanvas: cCanvas,
            cutCtx: cCtx,
            svgPaths: []
        };
    }

    function generateLayout() {
        if (uploadedStickers.length === 0) {
            alert("Upload minimal 1 gambar stiker dulu ya!");
            return;
        }

        const sizeOption = document.getElementById('sheetSize').value;
        const marginMm = parseFloat(document.getElementById('sheetMargin').value) || 0;
        const gapMm = parseFloat(document.getElementById('stickerGap').value) || 0;

        if (sizeOption === 'A4') { currentSheetW_mm = 210; currentSheetH_mm = 297; }
        else if (sizeOption === 'A4_Vendor') { currentSheetW_mm = 190; currentSheetH_mm = 277; }
        else if (sizeOption === 'A3') { currentSheetW_mm = 297; currentSheetH_mm = 420; }
        else if (sizeOption === 'A3Plus') { currentSheetW_mm = 329; currentSheetH_mm = 483; }
        else if (sizeOption === 'A3Plus_Vendor') { currentSheetW_mm = 300; currentSheetH_mm = 450; }
        else if (sizeOption === 'custom') {
            currentSheetW_mm = parseFloat(document.getElementById('customWidth').value) || 200;
            currentSheetH_mm = parseFloat(document.getElementById('customHeight').value) || 300;
        }

        const sheetW = MM_TO_PX(currentSheetW_mm);
        const sheetH = MM_TO_PX(currentSheetH_mm);
        const margin = MM_TO_PX(marginMm);
        const gap = MM_TO_PX(gapMm);

        pagesData = [];
        let currentPage = createNewPage(sheetW, sheetH);
        pagesData.push(currentPage);

        let curX = margin;
        let curY = margin;
        let maxRowHeight = 0;

        uploadedStickers.forEach(item => {
            const itemW = MM_TO_PX(item.widthMm);
            const itemH = MM_TO_PX(item.heightMm);

            for (let i = 0; i < item.qty; i++) {
                if (curX + itemW > sheetW - margin) {
                    curX = margin;
                    curY += maxRowHeight + gap;
                    maxRowHeight = 0;
                }

                if (curY + itemH > sheetH - margin) {
                    currentPage = createNewPage(sheetW, sheetH);
                    pagesData.push(currentPage);
                    curX = margin;
                    curY = margin;
                    maxRowHeight = 0;
                }

                // Cetak gambar stiker yang sudah bersih dari padding transparan
                currentPage.printCtx.drawImage(item.trimmedCanvas, curX, curY, itemW, itemH);

                // Render garis potong contour siluet
                currentPage.cutCtx.strokeStyle = '#FF0000';
                currentPage.cutCtx.lineWidth = 2;
                currentPage.cutCtx.beginPath();

                let svgPathData = "";
                item.contourPoints.forEach((pt, idx) => {
                    const px = curX + (pt.x * itemW);
                    const py = curY + (pt.y * itemH);
                    if (idx === 0) {
                        currentPage.cutCtx.moveTo(px, py);
                        svgPathData += `M ${((px * 25.4) / DPI).toFixed(2)} ${((py * 25.4) / DPI).toFixed(2)}`;
                    } else {
                        currentPage.cutCtx.lineTo(px, py);
                        svgPathData += ` L ${((px * 25.4) / DPI).toFixed(2)} ${((py * 25.4) / DPI).toFixed(2)}`;
                    }
                });
                currentPage.cutCtx.closePath();
                currentPage.cutCtx.stroke();

                svgPathData += " Z";
                const pathSvg = `<path d="${svgPathData}" fill="none" stroke="#FF0000" stroke-width="0.25" />`;
                currentPage.svgPaths.push(pathSvg);

                curX += itemW + gap;
                if (itemH > maxRowHeight) maxRowHeight = itemH;
            }
        });

        currentPageIndex = 0;
        renderCurrentPage();

        document.getElementById('pagination').style.display = 'flex';
        document.getElementById('actionButtons').style.display = 'flex';
    }

    function renderCurrentPage() {
        const pCanvas = document.getElementById('printCanvas');
        const cCanvas = document.getElementById('cutCanvas');
        const pageData = pagesData[currentPageIndex];

        pCanvas.width = pageData.printCanvas.width;
        pCanvas.height = pageData.printCanvas.height;
        pCanvas.getContext('2d').drawImage(pageData.printCanvas, 0, 0);

        cCanvas.width = pageData.cutCanvas.width;
        cCanvas.height = pageData.cutCanvas.height;
        cCanvas.getContext('2d').drawImage(pageData.cutCanvas, 0, 0);

        document.getElementById('pageIndicator').innerText = `Lembar ${currentPageIndex + 1} dari ${pagesData.length}`;
        document.getElementById('prevPageBtn').disabled = (currentPageIndex === 0);
        document.getElementById('nextPageBtn').disabled = (currentPageIndex === pagesData.length - 1);
    }

    function changePage(delta) {
        currentPageIndex += delta;
        renderCurrentPage();
    }

    function downloadCetakCurrent() {
        const link = document.createElement('a');
        link.download = `Cetak_Lembar_${currentPageIndex + 1}.png`;
        link.href = document.getElementById('printCanvas').toDataURL('image/png');
        link.click();
    }

    function downloadCuttingCurrent() {
        const svgStr = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${currentSheetW_mm}mm" height="${currentSheetH_mm}mm" viewBox="0 0 ${currentSheetW_mm} ${currentSheetH_mm}">
    <g id="CutlineLayer">
        ${pagesData[currentPageIndex].svgPaths.join('\n        ')}
    </g>
</svg>`;
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Cutting_Contour_Lembar_${currentPageIndex + 1}.svg`;
        link.click();
    }
</script>
</body>
</html>
